# First line of defense against floods/DDoS/scripted abuse, before any
# request reaches Node. Two zones: a generous one for ordinary page/API
# traffic, and a tighter one for auth-style endpoints. `limit_req_zone`
# just declares the shared-memory zone; the actual limiting happens per
# `location` below via `limit_req`. burst= allows short legitimate bursts
# (e.g. a page loading several assets at once) before rejecting with 429.
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# Docker's embedded DNS server. Plain `upstream { server backend:4000; }`
# blocks resolve the hostname ONCE when nginx starts and cache that IP for
# nginx's entire lifetime — if the backend/frontend container gets recreated
# (redeploy, crash-restart) it gets a new internal IP, and nginx keeps
# proxying to the old, now-dead one until nginx itself is restarted (seen as
# "connection refused" / 502s from a healthy backend). Using $variables in
# proxy_pass below, together with this resolver, makes nginx re-resolve on
# every request (respecting the valid= TTL) instead of caching forever.
resolver 127.0.0.11 valid=10s;

# blog runs on the host (not a Docker service), so it has a fixed loopback
# address — no dynamic re-resolution needed here, unlike the upstreams above.
upstream blog_upstream {
    server 127.0.0.1:4100;
}

# Published Studio sites: any-subdomain.visiyon.com is served straight off
# disk from the shared published_sites_data volume (see lib/sites.ts, which
# writes here on every Publish). Only a subdomain that's actually been
# published has a directory here — anything else (a reserved name like
# "www"/"app", an unpublished/typo'd subdomain, or the app's own subdomain)
# has no directory, so it falls through to the normal app routing (@app_fallback)
# instead of a raw nginx 404. This is the reason nobody needs a hardcoded
# list of reserved names in *this* file — lib/sites.ts's RESERVED_SUBDOMAINS
# is the only place that list lives; here, "no directory" already means
# "not a real published site, treat it like ordinary app traffic".
# Using a different base domain than visiyon.com? Update the regex below
# and BASE_DOMAIN in docker-compose.yml to match.
server {
    listen 80;
    server_name "~^(?<studio_subdomain>.+)\.visiyon\.com$";
    client_max_body_size 20m;
    limit_conn conn_zone 20;

    root /sites/$studio_subdomain;
    index index.html;

    # Blog admin proxy — serves blog.visiyon.com's admin UI through our own
    # origin so it can be embedded in an iframe without X-Frame-Options issues.
    # The blog's JS uses relative fetch() calls (/api/admin/...) which nginx
    # rewrites to the blog backend. Auth (JWT in localStorage) is handled
    # entirely by the blog's own login form — nothing sensitive passes through
    # the visiyon.com session.
    location /admin/blog/ {
        proxy_pass http://blog_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host blog.visiyon.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sub_filter rewrites absolute /api/ references in HTML/JS so they
        # stay under /admin/blog/ when the page is loaded through the proxy.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        sub_filter 'src="/api/' 'src="/admin/blog/api/';
        sub_filter "src='/api/" "src='/admin/blog/api/";
        sub_filter 'fetch("/api/' 'fetch("/admin/blog/api/';
        sub_filter "fetch('/api/" "fetch('/admin/blog/api/";
        sub_filter 'href="/css/' 'href="/admin/blog/css/';
        sub_filter 'src="/js/' 'src="/admin/blog/js/';
        sub_filter 'src="/ico' 'src="/admin/blog/ico';
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # /api/auth/me is a read-only session check called on every page load —
    # it must use general_zone, not auth_zone, or normal browser usage will
    # quickly exhaust the tight auth limit and get 503s.
    location = /api/auth/me {
        limit_req zone=general_zone burst=40 nodelay;
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream/auth/me$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Tighter limit specifically on auth endpoints (login/signup/password
    # reset) — nginx matches the longest prefix, so this wins over the
    # broader /api/ block below for anything under /api/auth/.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        # $variable in proxy_pass disables nginx's automatic prefix
        # stripping, so we do it explicitly instead (rewrite+break, then
        # $uri) or the backend gets the un-stripped /api/auth/... path.
        # IMPORTANT: `set` must come BEFORE `rewrite ... break;` — break
        # halts all further rewrite-module directives in this location,
        # and `set` belongs to the rewrite module too, so a `set` placed
        # after a `break` never runs (silently leaves the var undefined).
        set $backend_upstream backend:4000;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        set $backend_upstream backend:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ @app_fallback;
    }

    location @app_fallback {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80 default_server;
    client_max_body_size 20m;
    limit_conn conn_zone 20;

    # Blog admin proxy (same as subdomain block above).
    location /admin/blog/ {
        proxy_pass http://blog_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host blog.visiyon.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
        sub_filter 'src="/api/' 'src="/admin/blog/api/';
        sub_filter "src='/api/" "src='/admin/blog/api/";
        sub_filter 'fetch("/api/' 'fetch("/admin/blog/api/';
        sub_filter "fetch('/api/" "fetch('/admin/blog/api/";
        sub_filter 'href="/css/' 'href="/admin/blog/css/';
        sub_filter 'src="/js/' 'src="/admin/blog/js/';
        sub_filter 'src="/ico' 'src="/admin/blog/ico';
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # /api/auth/me is a read-only session check called on every page load —
    # it must use general_zone, not auth_zone.
    location = /api/auth/me {
        limit_req zone=general_zone burst=40 nodelay;
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream/auth/me$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        # $variable in proxy_pass disables nginx's automatic prefix
        # stripping, so we do it explicitly instead (rewrite+break, then
        # $uri) or the backend gets the un-stripped /api/auth/... path.
        # IMPORTANT: `set` must come BEFORE `rewrite ... break;` — break
        # halts all further rewrite-module directives in this location,
        # and `set` belongs to the rewrite module too, so a `set` placed
        # after a `break` never runs (silently leaves the var undefined).
        set $backend_upstream backend:4000;
        rewrite ^/api/auth/(.*)$ /auth/$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Backend API + streaming (SSE / chunked)
    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        set $backend_upstream backend:4000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # required for token-by-token streaming
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SearXNG's own web UI/API used to be reachable directly here for
    # debugging. Closed off: it was an unauthenticated public endpoint
    # (JSON search API + UI) that anyone on the internet could hit and
    # abuse as an anonymous search proxy. The backend still talks to
    # SearXNG container-to-container (visiyon network) — this route was
    # never needed for the app itself. Debug locally instead, e.g.
    # `docker compose exec searxng wget -qO- http://localhost:8080/search?q=test&format=json`
    # or a temporary `docker compose port searxng 8080` / SSH tunnel.

    # Everything else -> Next.js frontend
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Explicit timeouts (default is 60s each) so a slow SSO
        # round-trip, a Next.js SSR wait on a slow backend call, or the
        # blog under load doesn't trip nginx's default and surface as a
        # sporadic 504 to the client.
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
